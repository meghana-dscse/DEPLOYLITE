name: deploysphere

services:
  deploysphere:
    build: .
    container_name: deploysphere
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
